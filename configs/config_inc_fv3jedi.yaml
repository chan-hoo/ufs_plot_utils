input:
  parameters:
    cycle: t00z
    PDY: 20240224

  datasets:
    - name: fv3
      data_kind: increment   # increment | analysis | forecast | restart | observation | etc.
      geo:
        path: /work2/noaa/epic/chjeon/ufsda_hercules/ufs-da-workflow/fix/DATA_fix/FV3/Tiled/C96
        filename: C96.mx100_oro_data
        file_type: orog      # file | orog
      data:
        path: /work2/noaa/epic/chjeon/ufsda_hercules/ufs-da-workflow/fix/DATA_ref/atm
        filename: ufsda.t00z.atminc.cubed_sphere_grid
        file_type: tile      # file | tile
        var_list:
          - T_inc
          - u_inc
          - v_inc
        z_index: 76
        time_index: 0   # optional (default = 0)
      colormap:
        default: gist_ncar_r
        T_inc: RdBu_r
        u_inc: RdBu_r
        v_inc: RdBu_r
      range:
        default:
          vmin: null
          vmax: null
        T_inc:
          vmin: -2.5
          vmax: 2.5
        u_inc:
          vmin: -5
          vmax: 5
        v_inc:
          vmin: -5
          vmax: 5

    - name: jedi
      data_kind: increment   # increment | analysis | forecast | restart | observation | etc.
      geo:
        path: /work2/noaa/epic/chjeon/ufsda_hercules/ufs-da-workflow/fix/DATA_ref/atm
        filename: cubed_sphere_grid_atminc.jedi.nc
        file_type: file
      data:
        path: /work2/noaa/epic/chjeon/ufsda_hercules/ufs-da-workflow/fix/DATA_ref/atm
        filename: cubed_sphere_grid_atminc.jedi.nc
        file_type: file
        var_list:
          - tmp
          - ugrd
          - vgrd
        z_index: 76
        time_index: 0   # optional (default = 0)
      colormap:
        default: gist_ncar_r
        tmp: RdBu_r
        ugrd: RdBu_r
        vgrd: RdBu_r
      range:
        default:
          vmin: null
          vmax: null
        tmp:
          vmin: -2.5
          vmax: 2.5
        ugrd:
          vmin: -5
          vmax: 5
        vgrd:
          vmin: -5
          vmax: 5

output:
  path: ./
  prefix: atmdata

plot:
  cartopy_ne_path: /work2/noaa/epic/chjeon/ufsda_hercules/ufs-da-workflow/fix/NaturalEarth
  projection:
    name: Robinson    # Robinson | PlateCarree | Mollweide 
    central_longitude: -77.0369  # D.C.
  figure:
    figsize: [5, 2.5]
    dpi: 300
  colorbar:
    extend: both   # neither | both | min | max
    size: "3.5%"
    pad: 0.08
    label_fontsize: 8
    tick_fontsize: 7
  title:
    fontsize: 9
  background:
    features:
      - coastline
      #- land
      #- lakes
      #- states
      #- borders
    resolution: 50m
    linewidth: 0.5
    alpha: 0.7

