default:
  image: python:3.10

stages:
  - setup
  - test
  - docs

variables:
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"

cache:
  paths:
    - .cache/pip

setup:
  stage: setup
  script:
    - python --version
    - pip install --upgrade pip
    - pip install -r env/plot_env_list.txt
    - pip install pytest sphinx

# -----------------------
# Run unit/integration tests
# -----------------------
test:
  stage: test
  script:
    - pytest
  rules:
    - if: $CI_COMMIT_BRANCH

# -----------------------
# Build documentation
# -----------------------
docs:
  stage: docs
  script:
    - cd docs
    - make html
  artifacts:
    paths:
      - docs/build/html
  rules:
    - if: $CI_COMMIT_BRANCH == "main"

