# -----------------------------------
# Global configuration
# -----------------------------------
image: python:3.10-slim

stages:
  - setup
  - lint
  - test

variables:
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"
  VENV_PATH: "$CI_PROJECT_DIR/.venv"

cache:
  key: ${CI_COMMIT_REF_SLUG}
  paths:
    - .cache/pip

# -----------------------------------
# Setup (build environment once)
# -----------------------------------
setup:
  stage: setup
  script:
    - python --version
    - pip install --upgrade pip
    - python -m venv $VENV_PATH
    - source $VENV_PATH/bin/activate
    - pip install -r env/plot_env_list.txt
    - pip install -e .
    - pip check
  artifacts:
    paths:
      - .venv
    expire_in: 1 day
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH

# -----------------------------------
# Lint (reuse env, only run when code changed)
# -----------------------------------
lint:
  stage: lint
  dependencies:
    - setup
  script:
    - source $VENV_PATH/bin/activate
    - pip install flake8
    - flake8 configs docs tests ufs_plot_tools
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH
    - changes:
        - "**/*.py"

# -----------------------------------
# Test (reuse env)
# -----------------------------------
test:
  stage: test
  dependencies:
    - setup
  script:
    - source $VENV_PATH/bin/activate
    - pip install pytest pytest-cov
    - pytest --cov=./ --cov-report=xml --cov-report=term
  artifacts:
    reports:
      coverage_report:
        coverage_format: cobertura
        path: coverage.xml
    expire_in: 1 day
  coverage: '/TOTAL.*\s+(\d+%)$/'
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH

