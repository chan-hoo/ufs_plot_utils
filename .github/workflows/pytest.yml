name: pytest

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        python-version: ["3.10", "3.11"]

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Miniconda
        uses: conda-incubator/setup-miniconda@v3
        with:
          environment-file: env/ci_environment.yml
          activate-environment: test
          use-mamba: true

      - name: Run tests
        shell: bash -l {0}
        run: |
          conda activate test
          pytest -x -ra

