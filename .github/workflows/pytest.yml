name: ci_pytest

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        python-version: ["3.10"]

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Miniconda
        uses: conda-incubator/setup-miniconda@v3
        with:
          environment-file: env/ci_environment.yml
          activate-environment: test
          use-mamba: true
          auto-activate-base: false

      - name: Install package
        run: pip install -e .

      - name: Run tests
        run: PYTHONPATH=. conda run -n test pytest -x -ra


  mirror_to_gitlab:
    needs: test   # only runs if tests pass
    runs-on: ubuntu-latest

    if: github.ref == 'refs/heads/main'  # only mirror main branch

    steps:
      - name: Checkout repo (full history)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Push to GitLab
        run: |
          git remote add gitlab https://oauth2:${{ secrets.GITLAB_TOKEN }}@gitlab.com/chan-hoo/ufs_plot_utils.git
          git push gitlab HEAD:main --force
